<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="title desc">
  <title id="title">VTally-32 · WiFi tally light for vMix</title>
  <desc id="desc">An 8x8 LED tally glowing red for LIVE, linked by WiFi waves to a vMix switcher showing preview and program.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1024" />
      <stop offset="1" stop-color="#05060f" />
    </linearGradient>
    <radialGradient id="haloLive" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity="0.45" />
      <stop offset="0.55" stop-color="#ff3b3b" stop-opacity="0.1" />
      <stop offset="1" stop-color="#ff3b3b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="haloAccent" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1d33" />
      <stop offset="1" stop-color="#0c0d1a" />
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <pattern id="ledGlow" x="-88" y="-88" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="7.5" fill="#ff3b3b" />
    </pattern>
    <pattern id="ledCore" x="-88" y="-88" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="4.2" fill="#ffd2cc" />
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)" />
  <rect x="14" y="14" width="1252" height="392" rx="20" fill="none" stroke="#c7c9ff" stroke-opacity="0.08" />
  <rect x="14" y="14" width="1252" height="4" rx="2" fill="url(#accent)" opacity="0.8" />

  <!-- Specks of light -->
  <g fill="#d9d6ff">
    <circle cx="96" cy="70" r="1.4" opacity="0.5" />
    <circle cx="250" cy="372" r="1.1" opacity="0.4" />
    <circle cx="640" cy="52" r="1.2" opacity="0.35" />
    <circle cx="1188" cy="84" r="1.5" opacity="0.45" />
    <circle cx="1104" cy="372" r="1.1" opacity="0.4" />
    <circle cx="760" cy="388" r="1.3" opacity="0.3" />
  </g>

  <!-- The tally: case and 8x8 LED matrix, on air -->
  <g transform="translate(200 210)">
    <circle r="170" fill="url(#haloLive)" />
    <rect x="-100" y="-100" width="200" height="200" rx="30" fill="url(#case)" stroke="#c7c9ff" stroke-opacity="0.16" />
    <rect x="-88" y="-88" width="176" height="176" fill="url(#ledGlow)" filter="url(#glow)" />
    <rect x="-88" y="-88" width="176" height="176" fill="url(#ledCore)" />
    <rect x="-34" y="112" width="68" height="22" rx="11" fill="#ff3b3b" />
    <text x="0" y="128" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="2">LIVE</text>
  </g>

  <!-- WiFi waves towards vMix -->
  <g fill="none" stroke-linecap="round">
    <path d="M330 166 Q350 210 330 254" stroke="#a855f7" stroke-width="3" stroke-opacity="0.75" />
    <path d="M360 146 Q388 210 360 274" stroke="#8b5cf6" stroke-width="3" stroke-opacity="0.55" />
    <path d="M390 126 Q426 210 390 294" stroke="#6366f1" stroke-width="3" stroke-opacity="0.35" />
    <path d="M430 210 H470" stroke="#a78bfa" stroke-width="1.6" stroke-opacity="0.5" stroke-dasharray="2 7" />
  </g>

  <!-- vMix switcher: preview and program -->
  <g transform="translate(560 210)">
    <circle r="90" fill="url(#haloAccent)" />
    <rect x="-82" y="-50" width="164" height="100" rx="14" fill="url(#case)" stroke="#c7c9ff" stroke-opacity="0.18" />
    <rect x="-70" y="-36" width="66" height="44" rx="5" fill="#0b2a19" stroke="#22c55e" stroke-width="2.5" />
    <rect x="4" y="-36" width="66" height="44" rx="5" fill="#2a0b0b" stroke="#ff3b3b" stroke-width="2.5" />
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">
      <text x="-37" y="30" fill="#22c55e">PVW</text>
      <text x="37" y="30" fill="#ff3b3b">PGM</text>
    </g>
  </g>

  <!-- Title -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="700" y="176" font-size="74" font-weight="600" fill="#f1f0ff" letter-spacing="2">VTally-32</text>
    <text x="704" y="228" font-size="40" font-weight="300" fill="#a78bfa" letter-spacing="1">WiFi tally light for vMix</text>
    <text x="704" y="276" font-size="22" fill="#9ea0c4">A cheap ESP32 board on every camera,</text>
    <text x="704" y="306" font-size="22" fill="#9ea0c4">set up from a browser, updated over the air</text>
    <text x="704" y="350" font-size="17" fill="#a78bfa" letter-spacing="1.5">ESP32 · ESP32-S3 · vMix TCP API · OTA</text>
  </g>
</svg>
